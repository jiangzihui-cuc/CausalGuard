apply plugin: 'com.android.application'

android {
    namespace 'com.causalguard'
    compileSdk 37

    defaultConfig {
        applicationId 'com.causalguard'
        minSdk 29
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
